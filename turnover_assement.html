<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turnover Assessment Dashboard - Khoj Hub</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Chart.js DataLabels Plugin CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <!-- PapaParse CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Library Stylesheet -->
  <link rel="stylesheet" href="khoj_dashboard.css">
</head>
<body class="light-theme">

  <!-- Header -->
  <header>
    <a href="index.html" class="logo-container">
      <div class="logo-icon">K</div>
      <div class="logo-text">
        <h1>Khoj Hub</h1>
        <p>Market Intelligence Engine</p>
      </div>
    </a>
  </header>

  <!-- Main Content Area -->
  <main>
    <!-- Navigation Bar -->
    <div class="nav-bar">
      <a href="historical_analytical.html" class="back-btn">
        <svg class="back-btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Back to Historical & Analytical Data
      </a>
    </div>

    <!-- Page Header -->
    <div class="page-header">
      <h2 class="page-title">Turnover Assessment Dashboard</h2>
      <p class="page-desc">
        Analyze daily/monthly market turnover, trading volumes, and close prices. Use the filters below to dynamically update visualizations.
      </p>
    </div>

    <!-- Reusable Dashboard Container -->
    <div class="khoj-dashboard turnover_"></div>
  </main>

  <!-- Library script -->
  <script src="khoj_dashboard.js"></script>

  <!-- Prevent Theme Flicker -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'dark') {
        document.body.classList.remove('light-theme');
      } else {
        document.body.classList.add('light-theme');
      }
    })();
  </script>
</body>
</html>
